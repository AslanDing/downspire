		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #f2ead8; background-color: #0b0a0d; overflow: hidden; touch-action: none; height: 100%; }
/* The shell sizes the canvas (window x devicePixelRatio, see fitCanvas). Never set its width/height here. */
#canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; background-color: #0b0a0d; display: flex; flex-direction: column;
	justify-content: center; align-items: center; visibility: hidden; font: 14px monospace; gap: 14px; }
#status-splash { width: 128px; height: 128px; image-rendering: pixelated; }
#status-text { letter-spacing: 2px; }
#status-progress { width: 240px; height: 6px; appearance: none; border: 0; background: #241f26; }
#status-progress::-webkit-progress-bar { background: #241f26; }
#status-progress::-webkit-progress-value { background: #ffd27a; }
#status-progress::-moz-progress-bar { background: #ffd27a; }
#status-size { font: 12px monospace; color: #9d9384; }
#status-notice { display: none; background: #2a1a1c; border: 1px solid #a8987a; color: #f2ead8; padding: 1rem;
	margin: 0 2rem; text-align: center; line-height: 1.4; white-space: pre-line; }
#home { position: fixed; left: 12px; top: 10px; z-index: 5; color: #d8cbb0; font: 13px monospace;
	text-decoration: none; opacity: 0.7; transition: opacity 0.4s; }
#home.hidden { opacity: 0; pointer-events: none; }
#status-start { display: none; font: 16px monospace; color: #0b0a0d; background: #f2ead8; border: 0; padding: 8px 22px;
	cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 0 2px #0b0a0d, 0 0 0 4px #ffd27a; }
#status-start:hover, #status-start:focus { background: #ffffff; outline: none; }
#status-hint { display: none; font: 12px monospace; color: #9d9384; text-align: center; line-height: 1.7; max-width: 720px; padding: 0 16px; }
#status-hint b { color: #d8cbb0; font-weight: normal; }
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">你的浏览器不支持 canvas。</canvas>
		<noscript>需要启用 JavaScript。</noscript>
		<a id="home" href="/others/#games">← 全部游戏</a>
		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<div id="status-text">倒塔 DOWNSPIRE · 加载中</div>
			<progress id="status-progress"></progress>
			<div id="status-size"></div>
			<button id="status-start" type="button">点击开始 · CLICK TO START</button>
			<div id="status-hint"><b>试玩版</b>：单人、本机合作和对抗；可以添加执行器（规则 AI）当队友或对手。没有联机，也没有大模型 Agent。<br>
				WASD 移动 · 左键 轻击 · 右键 重击 · 空格 闪避 · Shift 武技 · Q / E 技能 · R 种族技<br>
				F 互动 · 1 药水 · Tab 地图 · I 背包 · Esc 菜单 · M 静音 · F11 全屏 · 也可以用手柄<br>
				Chrome / Edge / Firefox 桌面版 · 存档留在这个浏览器里</div>
			<div id="status-notice"></div>
		</div>

		<script>
// ---- shell additions -------------------------------------------------------------------------------
(function () {
	const params = new URLSearchParams(window.location.search);
	const debug = params.get('debug') === '1';
	const canvas = () => document.getElementById('canvas');
	// the shell's own text follows ?lang=, else the browser (the game itself picks its language the same way)
	const lang = params.get('lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
	window.__shellLang = lang;
	if (lang === 'en') {
		document.documentElement.lang = 'en';
		document.title = 'DOWNSPIRE · demo';
		document.getElementById('home').textContent = '← All games';
		document.getElementById('status-text').textContent = 'DOWNSPIRE · loading';
		document.getElementById('status-hint').innerHTML = '<b>Demo</b>: solo, local co-op and versus; add executors (rule-based AI) as team mates or rivals. No online play and no LLM Agents.<br>'
			+ 'WASD move · left click light · right click heavy · Space dodge · Shift weapon art · Q / E skills · R race skill<br>'
			+ 'F interact · 1 potion · Tab map · I bag · Esc menu · M mute · F11 full screen · a gamepad works too<br>'
			+ 'Desktop Chrome / Edge / Firefox · saves stay in this browser';
	}
	// 0) exact canvas sizing (the export uses canvas_resize_policy = None): backing = floor(inner * dpr) and CSS
	//    size = backing / dpr, so every canvas pixel lands on exactly one device pixel, also at fractional zoom.
	function fitCanvas() {
		const c = canvas();
		const dpr = window.devicePixelRatio || 1;
		const cw = document.documentElement.clientWidth || window.innerWidth;
		const ch = document.documentElement.clientHeight || window.innerHeight;
		const w = Math.max(1, Math.floor(cw * dpr + 1e-4));
		const h = Math.max(1, Math.floor(ch * dpr + 1e-4));
		if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
		c.style.width = (w / dpr) + 'px';
		c.style.height = (h / dpr) + 'px';
	}
	window.addEventListener('resize', fitCanvas);
	(function watchDpr() {   // zoom or a move to another monitor changes the DPR without always firing resize
		const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
		mq.addEventListener('change', () => { fitCanvas(); watchDpr(); }, { once: true });
	}());
	fitCanvas();
	// 1) browser-reserved keys: keep them from scrolling or searching while the game has focus (F5 / F11 / F12 stay)
	const BLOCK = new Set(['Tab', ' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', '/', "'", 'F1', 'F3', 'Backspace']);
	window.addEventListener('keydown', (e) => { if (document.activeElement === canvas() && BLOCK.has(e.key)) e.preventDefault(); });
	// 2) mouse: the wheel never scrolls the page, middle click never auto-scrolls, side buttons never navigate back
	window.addEventListener('wheel', (e) => { if (e.target === canvas()) e.preventDefault(); }, { passive: false });
	for (const t of ['mousedown', 'mouseup', 'auxclick']) {
		window.addEventListener(t, (e) => { if (e.target === canvas() && e.button >= 1) e.preventDefault(); });
	}
	// 3) the back-to-homepage link: hidden in iframes and debug captures, fades when the mouse rests
	const home = document.getElementById('home');
	if (window.self !== window.top || debug) home.remove();
	let hideTimer = 0;
	window.addEventListener('mousemove', (e) => {
		if (!home.isConnected) return;
		if (e.clientY < 60) home.classList.remove('hidden');
		clearTimeout(hideTimer);
		hideTimer = setTimeout(() => home.classList.add('hidden'), 3000);
	});
	hideTimer = setTimeout(() => home.classList.add('hidden'), 3000);
}());
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":78330472,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusSize = document.getElementById('status-size');
	const statusNotice = document.getElementById('status-notice');
	const en = window.__shellLang === 'en';
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function displayFailureNotice(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : (en ? 'Something went wrong.' : '发生未知错误。'));
		statusNotice.textContent = msg + (en ? '\nPlease use an up-to-date desktop Chrome, Edge or Firefox.' : '\n请使用最新版 Chrome / Edge / Firefox 桌面浏览器。');
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice((en ? 'This browser lacks features the game needs:\n' : '缺少运行所需的浏览器功能：\n') + missing.join('\n'));
		return;
	}
	// Download first, start on a click: the click is the gesture browsers want before audio may play. ?start=1 (the
	// homepage's link) and ?autostart=1 skip the click: the title's "press any key" is the first gesture then.
	setStatusMode('progress');
	const startButton = document.getElementById('status-start');
	const startHint = document.getElementById('status-hint');
	startHint.style.display = 'block';
	const params = new URLSearchParams(window.location.search);
	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || (exe + '.pck');
	engine.config.update({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				statusSize.textContent = (current / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB';
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
	});
	// ?debug=1&args=--a=1+--b=2: extra user arguments for the game (tests); never on the homepage's link
	let extra = [];
	if (params.get('debug') === '1' && params.get('args')) {
		extra = params.get('args').split(' ').filter((s) => s !== '');
	}
	engine.config.args = ['--main-pack', pack].concat(engine.config.args).concat(extra.length ? ['--'].concat(extra) : []);
	function run() {
		startButton.disabled = true;
		engine.start().then(() => {
			setStatusMode('hidden');
			const c = document.getElementById('canvas');
			if (c) c.focus();
		}, displayFailureNotice);
	}
	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
		if (params.get('autostart') === '1' || params.get('start') === '1') {
			run();
			return;
		}
		statusProgress.style.display = 'none';
		statusSize.textContent = '';
		document.getElementById('status-text').textContent = en ? 'DOWNSPIRE · demo' : '倒塔 DOWNSPIRE · 试玩版';
		startButton.style.display = 'block';
		startButton.focus();
		startButton.addEventListener('click', run, { once: true });
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
